name: Bug report
description: Report a defect in AITOOL
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and the impact.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AITOOL / Primavera version
      placeholder: "AITOOL 2.13.0 · Primavera 10.0020.3514 Executive · instância DEFAULT (Settings → Diagnóstico, first line)"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "Attach the zip from Settings → Diagnóstico → Exportar pacote de apoio (already redacted), or paste lines from %LocalAppData%/Cegid/Extensions/AITOOL/Logs/."
      render: text
    validations:
      required: false
