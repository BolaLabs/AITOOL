name: Bug report
description: Report a defect in AITOOL
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and the impact.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AITOOL / Primavera version
      placeholder: "AITOOL <commit>, Primavera v10 SG100"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "From %LocalAppData%/Cegid/Extensions/AITOOL/Logs/ — redact any secrets first."
      render: text
    validations:
      required: false
