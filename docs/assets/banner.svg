<svg xmlns="http://www.w3.org/2000/svg" width="960" height="150" viewBox="0 0 960 150" role="img" aria-label="AITOOL - AI assistant embedded in ERP Primavera v10">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24466E"/>
      <stop offset="1" stop-color="#16304F"/>
    </linearGradient>
    <linearGradient id="baseline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9A441" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#D9A441" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#D9A441" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g transform="translate(30,29) scale(1.4375)">
    <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#tile)"/>
    <path d="M19 45 L32 19 L45 45" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="44.5" r="4.6" fill="#D9A441"/>
  </g>

  <text x="142" y="82" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="46" font-weight="800" letter-spacing="3">
    <tspan fill="#D9A441">AI</tspan><tspan fill="#768390" dx="6">TOOL</tspan>
  </text>
  <text x="145" y="112" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#8b98a5" letter-spacing="0.4">AI assistant embedded in ERP Primavera v10 — chat, ERP tools, window automation</text>

  <g font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="12" text-anchor="middle">
    <rect x="588" y="52" width="100" height="28" rx="14" fill="none" stroke="#8b98a5" stroke-width="1.2" opacity="0.7"/>
    <text x="638" y="70" fill="#8b98a5">streaming</text>
    <rect x="696" y="52" width="104" height="28" rx="14" fill="none" stroke="#8b98a5" stroke-width="1.2" opacity="0.7"/>
    <text x="748" y="70" fill="#8b98a5">tool calling</text>
    <rect x="808" y="52" width="132" height="28" rx="14" fill="none" stroke="#D9A441" stroke-width="1.3"/>
    <text x="874" y="70" fill="#D9A441">2-step ERP writes</text>
  </g>

  <rect x="0" y="145" width="960" height="3" rx="1.5" fill="url(#baseline)"/>
